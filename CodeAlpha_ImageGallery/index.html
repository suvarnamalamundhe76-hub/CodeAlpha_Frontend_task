<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery | CodeAlpha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>My Image Gallery</h1>
        <p>Explore my collection of beautiful images</p>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="flower">Flowers</button>
        <button class="filter-btn" data-filter="other">Other</button>
    </div>

    <main class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="images/image1.jpg" alt="Nature Image" onclick="openLightbox(0)">
        </div>

        <div class="gallery-item" data-category="flower">
            <img src="images/image2.jpg" alt="Flower Image" onclick="openLightbox(1)">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="images/image3.jpg" alt="Nature Image" onclick="openLightbox(2)">
        </div>

        <div class="gallery-item" data-category="other">
            <img src="images/image4.jpg" alt="Gallery Image" onclick="openLightbox(3)">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="images/image5.jpg" alt="Nature Image" onclick="openLightbox(4)">
        </div>

    </main>

    <div class="lightbox" id="lightbox">

        <button class="close" onclick="closeLightbox()">&times;</button>

        <button class="nav-btn prev" onclick="changeImage(-1)">&#10094;</button>

        <img id="lightboxImage" src="" alt="Preview">

        <button class="nav-btn next" onclick="changeImage(1)">&#10095;</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
